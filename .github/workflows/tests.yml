# Runs the test suite on every pull request and every push to main, then deploys to Cloud Run
# after a push to main whose tests pass.
#
# The test job uses a throwaway PostgreSQL database that lives only inside the job, and no
# secrets, so the tests can never reach the Neon databases. Only the deploy job reads the
# GCP_CREDENTIALS secret, and it writes the key outside the repository checkout.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Runs on main are never cancelled,
# so a deploy can't be stopped halfway.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studyhub
          POSTGRES_PASSWORD: studyhub
          POSTGRES_DB: studyhub_test
          # Same collation as Neon, so text sorts and compares the same way.
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyhub -d studyhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://studyhub:studyhub@localhost:5432/studyhub_test
      # Empty on purpose: the tests must never see a real database.
      DATABASE_URL: ""
      BULLETIN_AUTO_CRAWL: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -rxs

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time; a newer one waits for the current one instead of cancelling it.
    concurrency:
      group: deploy-scu-study-tutor-groups
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sign in to Google Cloud
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -z "$GCP_CREDENTIALS" ]; then
            echo "::error::The GCP_CREDENTIALS secret is not set."
            exit 1
          fi
          # Outside the checkout, so the key can't end up in the repository or the uploaded source.
          key="$RUNNER_TEMP/gcp-credentials.json"
          (umask 077 && printf '%s' "$GCP_CREDENTIALS" > "$key")
          gcloud auth activate-service-account --key-file="$key"
          rm -f "$key"

      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy scu-study-tutor-groups
          --source .
          --project scu-study-tutor-groups
          --region us-west1
          --allow-unauthenticated
          --quiet
