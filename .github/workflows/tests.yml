# Runs the test suite against a throwaway PostgreSQL database that lives only inside this job.
# No secrets are used and nothing is deployed, so the tests can never reach the Neon databases.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studyhub
          POSTGRES_PASSWORD: studyhub
          POSTGRES_DB: studyhub_test
          # Same collation as Neon, so text sorts and compares the same way.
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyhub -d studyhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://studyhub:studyhub@localhost:5432/studyhub_test
      # Empty on purpose: the tests must never see a real database.
      DATABASE_URL: ""
      BULLETIN_AUTO_CRAWL: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -rxs
